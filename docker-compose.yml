services:
    rabbit:
        image: rabbitmq:3-management
        restart: always
        ports:
            - "${RABBIT_HOST_DOCKER_PORT:-5672}:${RABBIT_CONTAINER_DOCKER_PORT:-5672}"
            - "${RABBIT_HOST_DOCKER_WEB_PORT}:${RABBIT_CONTAINER_DOCKER_WEB_PORT}"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBIT_LOGIN}
            RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
        env_file:
            - .env
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 15s
    db:
        image: postgres:alpine
        restart: always
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${DATABASE_USER}
            POSTGRES_PASSWORD: ${DATABASE_PASS}
            POSTGRES_DB: ${DATABASE_NAME}
        ports:
            - "${DATABASE_HOST_DOCKER_PORT:-5432}:${DATABASE_CONTAINER_DOCKER_PORT:-5432}"
        volumes:
            - pg_data:/var/lib/postgresql
            - ./sql-scripts:/docker-entrypoint-initdb.d/
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5

    fastapi:
        build: ./api
        restart: always
        working_dir: /app
        ports:
            - "8000:8000"
        environment:
            - PYTHONPATH=/app
        env_file:
            - api/api.env
        command: sh -c "uv run alembic upgrade head && uv run python -m uvicorn main:app --host 0.0.0.0 --port 8000"
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            rabbit:
                condition: service_healthy
            db:
                condition: service_healthy

    checker_worker:
        build: ./checker/checker_worker
        restart: always
        working_dir: /app
        environment:
            - PYTHONPATH=/app
        env_file:
            - checker/checker_worker/checker_worker.env
        command: sh -c "uv run faststream run check:app"
        depends_on:
            rabbit:
                condition: service_healthy
            db:
                condition: service_healthy

    checker_db:
        build: ./checker/checker_db
        restart: always
        working_dir: /app
        environment:
            - PYTHONPATH=/app
        env_file:
            - checker/checker_db/checker_db.env
        command: sh -c "uv run alembic upgrade head && uv run faststream run db_worker:app"
        depends_on:
            rabbit:
                condition: service_healthy
            db:
                condition: service_healthy

    sendler:
        build: ./sendler
        restart: always
        environment:
            - PYTHONDONTWRITEBYTECODE=1
            - PYTHONUNBUFFERED=1
            - PYTHONPATH=/app
            - UV_PROJECT_ENVIRONMENT=/app/.venv
        env_file:
            - sendler/sendler.env
        command: sh -c "uv run alembic upgrade head && uv run faststream run sendler:app"
        depends_on:
            rabbit:
                condition: service_healthy

